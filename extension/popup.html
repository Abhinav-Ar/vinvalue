<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .header-title { font-weight: 700; font-size: 15px; }
    .header-sub { font-size: 11px; opacity: 0.7; }

    .body { padding: 14px 16px; }

    /* Empty / not logged in */
    .empty {
      text-align: center;
      padding: 28px 0;
      color: #64748b;
      line-height: 1.6;
    }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }
    .empty a { color: #818cf8; text-decoration: none; font-weight: 600; }

    /* Garage list */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 8px;
    }

    .car-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .car-list::-webkit-scrollbar { width: 4px; }
    .car-list::-webkit-scrollbar-track { background: transparent; }
    .car-list::-webkit-scrollbar-thumb { background: #2d2d4a; border-radius: 4px; }

    .car-item {
      background: #1a1a2e;
      border: 1.5px solid #2d2d4a;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .car-item:hover { border-color: #4f46e5; background: #1e1e3a; }
    .car-item.selected {
      border-color: #7c3aed;
      background: #1e1535;
    }

    .car-item-name {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .car-item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .chip {
      background: #0f0f1a;
      border: 1px solid #2d2d4a;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      color: #94a3b8;
    }

    /* Fill button */
    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
    }

    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      min-height: 16px;
    }
    .status.ok { color: #34d399; }
    .status.err { color: #f87171; }

    .divider { height: 1px; background: #1e1e35; margin: 10px 0; }

    .open-link {
      display: block;
      text-align: center;
      color: #475569;
      font-size: 11px;
      text-decoration: none;
      padding-top: 2px;
    }
    .open-link:hover { color: #818cf8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <div class="header-title">AutoIQ</div>
      <div class="header-sub">Car form filler</div>
    </div>
  </div>

  <div class="body">
    <div id="state-empty" class="empty" style="display:none">
      <div class="empty-icon">🚗</div>
      <div>No cars in your garage.</div>
      <div>Save a car on <a href="https://vinvalue-ebon.vercel.app/appraise" target="_blank">AutoIQ</a> first.</div>
    </div>

    <div id="state-login" class="empty" style="display:none">
      <div class="empty-icon">🔒</div>
      <div>Sign in to <a href="https://vinvalue-ebon.vercel.app" target="_blank">AutoIQ</a> to see your garage here.</div>
    </div>

    <div id="state-cars" style="display:none">
      <div class="section-label">Your garage — pick a car</div>
      <div class="car-list" id="car-list"></div>
      <button class="btn btn-primary" id="btn-fill" disabled>Fill form on this page</button>
      <div class="status" id="status"></div>
      <div class="divider"></div>
      <a class="open-link" href="https://vinvalue-ebon.vercel.app/garage" target="_blank">Manage garage on AutoIQ →</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
