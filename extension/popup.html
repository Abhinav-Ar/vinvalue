<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: #f7f4ee;
      color: #211b16;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #ddd5c9;
    }
    .logo {
      width: 28px; height: 28px;
      background: #211b16;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; color: #f7f4ee;
      font-weight: 800;
    }
    .header-title { font-weight: 600; font-size: 13px; }
    .header-sub { font-size: 11px; color: #766b60; margin-top: 1px; }

    .body { padding: 12px 14px; }

    .empty {
      text-align: center;
      padding: 24px 0;
      color: #766b60;
      line-height: 1.6;
    }
    .empty-icon { font-size: 24px; margin-bottom: 8px; }
    .empty a { color: #b64d12; text-decoration: none; font-weight: 600; }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9a4b22;
      margin-bottom: 8px;
    }

    .car-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 140px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .car-list::-webkit-scrollbar { width: 3px; }
    .car-list::-webkit-scrollbar-track { background: transparent; }
    .car-list::-webkit-scrollbar-thumb { background: #d0c5b7; border-radius: 4px; }

    .car-item {
      background: #fffdf9;
      border: 1px solid #ddd5c9;
      border-radius: 12px;
      padding: 9px 11px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      user-select: none;
    }
    .car-item:hover { border-color: #bfad9d; background: #fff; }
    .car-item.selected { border-color: #c85b1b; background: #fff7ed; }

    .car-item-name { font-weight: 600; font-size: 12.5px; }
    .car-item-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .chip {
      border: 1px solid #ddd5c9;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      color: #766b60;
    }

    .divider { height: 1px; background: #e6dfd5; margin: 12px 0; }

    /* Detail panel */
    .detail-panel {
      background: #fffdf9;
      border: 1px solid #ddd5c9;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .detail-panel-header {
      padding: 7px 12px;
      border-bottom: 1px solid #e6dfd5;
      background: #f1ece4;
    }
    .detail-panel-title { font-size: 11px; font-weight: 600; }
    .detail-panel-sub { font-size: 10px; color: #766b60; margin-top: 1px; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .detail-cell {
      padding: 7px 12px;
      border-right: 1px solid #eee8df;
      border-bottom: 1px solid #eee8df;
      cursor: pointer;
      transition: background 0.1s;
      position: relative;
    }
    .detail-cell:nth-child(even) { border-right: none; }
    .detail-cell:hover { background: #faf6ef; }
    .detail-cell.full-width {
      grid-column: 1 / -1;
      border-right: none;
    }
    .detail-cell-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #8c8074;
      margin-bottom: 2px;
    }
    .detail-cell-value {
      font-size: 11.5px;
      font-weight: 500;
      color: #322a23;
      word-break: break-all;
    }
    .detail-cell-value.mono {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 10.5px;
      letter-spacing: 0.03em;
    }
    .detail-cell-value.good { color: #19734a; }
    .detail-cell-value.warn { color: #9a5a08; }
    .detail-cell-value.bad  { color: #b42318; }

    .copy-hint {
      position: absolute;
      top: 4px; right: 7px;
      font-size: 9px;
      color: #8c8074;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .detail-cell:hover .copy-hint { opacity: 1; }
    .detail-cell.copied .copy-hint { opacity: 1; color: #19734a; }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      transition: opacity 0.12s;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-primary { background: #c55416; color: #fffaf4; }

    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #766b60;
      text-align: center;
      min-height: 15px;
    }
    .status.ok { color: #19734a; }
    .status.err { color: #b42318; }

    .open-link {
      display: block;
      text-align: center;
      color: #766b60;
      font-size: 10.5px;
      text-decoration: none;
    }
    .open-link:hover { color: #b64d12; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">A</div>
    <div>
      <div class="header-title">AutoIQ</div>
      <div class="header-sub">Use a saved vehicle anywhere</div>
    </div>
  </div>

  <div class="body">
    <div id="state-empty" class="empty" style="display:none">
      <div class="empty-icon">◇</div>
      <div>No cars in your garage.</div>
      <div style="margin-top:4px">Save a car on <a href="https://autoiq-vinvalue.vercel.app/appraise" target="_blank">AutoIQ</a> first.</div>
    </div>

    <div id="state-login" class="empty" style="display:none">
      <div class="empty-icon">○</div>
      <div>Sign in to <a href="https://autoiq-vinvalue.vercel.app" target="_blank">AutoIQ</a> to see your garage here.</div>
    </div>

    <div id="state-cars" style="display:none">
      <div class="section-label">Your garage</div>
      <div class="car-list" id="car-list"></div>

      <div class="detail-panel" id="detail-panel" style="display:none">
        <div class="detail-panel-header">
          <div class="detail-panel-title" id="detail-panel-title">Car details</div>
          <div class="detail-panel-sub">Tap any field to copy</div>
        </div>
        <div class="detail-grid" id="detail-grid"></div>
      </div>

      <button class="btn btn-primary" id="btn-fill" disabled>Fill supported fields</button>
      <div class="status" id="status"></div>
      <div class="divider"></div>
      <a class="open-link" href="https://autoiq-vinvalue.vercel.app/garage" target="_blank">Manage garage on AutoIQ →</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
